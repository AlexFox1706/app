# Сборка APK на серверах GitHub — без своего компьютера.
# Готовый файл: вкладка Actions → последний запуск → Artifacts → task_reminder-apk
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сгенерировать недостающие файлы Android
        run: flutter create --org kz.reminder --project-name task_reminder --platforms android .

      - name: Включить desugaring
        run: dart run tool/patch_android.dart

      - run: flutter pub get

      - name: Проверка кода (падает только на ошибках)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты расписания
        run: flutter test

      - name: Сборка APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: task_reminder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
