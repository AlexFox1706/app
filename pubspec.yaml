name: task_reminder
description: "Локальная напоминалка задач: календарь день/неделя, разовые и регулярные задачи, полноэкранные напоминания."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  sqflite: ^2.4.2
  path: ^1.9.0
  intl: ^0.20.2
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
